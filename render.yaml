services:
  - type: web
    name: prepsync
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
